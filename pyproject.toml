[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cachecortex"
version = "0.1.0"
description = "Three-region prompt cache orchestration for LLM APIs: prefix sessions, capability probing, hit-rate budgeting, and scenario-adaptive optimization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ExoCortex project" }]
keywords = ["llm", "prompt-caching", "deepseek", "prefix-cache", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []          # 核心零依赖；openai extras 按需

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["cachecortex*"]
